spring:
  application:
    name: fittrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # This machine (and many dev setups) sets SPRING_PROFILES_ACTIVE=local globally, which overrides the default above.
    # Treat "local" as local development so IDE runs still get the dev settings (JWT key, DB, admin bootstrap).
    group:
      local: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/fittrack}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Only probe SMTP when email sending is actually enabled.
      enabled: ${MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). MUST be overridden in production via JWT_SECRET.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: fittrack
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
  password-reset:
    token-ttl: PT30M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    # LOCAL = files on disk (dev). S3 = AWS S3 bucket (credentials via the standard AWS chain:
    # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env vars, ~/.aws/credentials, or an IAM role).
    type: ${STORAGE_TYPE:LOCAL}
    root: ${STORAGE_ROOT:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    presign-ttl: PT1H
    max-video-bytes: 524288000
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
      prefix: ${AWS_S3_PREFIX:}
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style: ${AWS_S3_PATH_STYLE:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@fittrack.local}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  billing:
    trial-days: ${BILLING_TRIAL_DAYS:7}
    razorpay:
      # Get test keys free at https://dashboard.razorpay.com (Settings -> API Keys). Empty = online payments disabled.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
    window: PT5M
